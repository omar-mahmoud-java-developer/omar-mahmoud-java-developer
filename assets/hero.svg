<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Omar Qenawy, Senior Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle r="170" fill="url(#glow)"><animate attributeName="cx" values="120;780;120" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;220;40" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#8b949e" font-size="14">
    <text x="36" y="44">~/omar <tspan fill="#3fb950">main</tspan> $ whoami</text>
  </g>
  <text x="36" y="112" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="800" fill="url(#ink)">Omar Qenawy</text>
  <text x="36" y="152" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#c9d1d9">Senior Backend Engineer · Java · Spring Boot · AWS</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#58a6ff">
    <text x="36" y="206">&gt; <tspan fill="#e6edf3">secure, fast, boring-in-production systems</tspan></text>
    <rect x="490" y="191" width="10" height="20" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <text x="864" y="236" text-anchor="start" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="18" fill="#8b949e" direction="rtl">أبني backend بيشتغل صح تحت الضغط</text>
</svg>
